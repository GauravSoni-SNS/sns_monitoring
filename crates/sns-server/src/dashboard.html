<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SNS Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#eceef5;--ink2:#b6bacb;--mut:#7a8099;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.055);
    --cherry:#8b7bff;--cherry-deep:#6d5efc;--cherry-soft:rgba(124,108,255,.14);--ring:rgba(124,108,255,.38);
    --grad:linear-gradient(135deg,#7c6cff,#a855f7);
    --ok:#34d399;--ok-soft:rgba(52,211,153,.14);--warn:#fbbf24;--bad:#fb7185;--bad-soft:rgba(251,113,133,.14);
    --bg:#080910;--surf:rgba(255,255,255,.035);--surf2:rgba(255,255,255,.06);--radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:radial-gradient(1100px 600px at 12% -8%,rgba(124,108,255,.18),transparent 60%),radial-gradient(900px 600px at 100% 0,rgba(168,85,247,.14),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
  a{color:var(--cherry)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 18px}
  header{background:rgba(10,11,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .wrap{display:flex;align-items:center;gap:12px;height:62px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 6px 18px var(--ring)}
  .brand{font-weight:700}
  .brand small{display:block;color:var(--mut);font-weight:500;font-size:11.5px}
  .spacer{flex:1}
  .btn{background:var(--grad);color:#fff;border:none;border-radius:11px;padding:10px 17px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(124,108,255,.28);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(124,108,255,.42)}
  .btn.ghost{background:var(--surf2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--cherry);transform:none}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  input,select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--surf2);color:var(--ink);color-scheme:dark}
  input::placeholder{color:var(--mut)}
  input:focus,select:focus{outline:none;border-color:var(--cherry);box-shadow:0 0 0 3px var(--ring)}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .muted{color:var(--mut);font-size:12.5px}
  h4{margin:0 0 8px}
  /* login */
  .login{max-width:400px;margin:9vh auto;padding:34px;position:relative;overflow:hidden}
  .login::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
  .login h1{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
  .login .field{margin-top:14px}
  .login label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
  .login input{width:100%}
  .login .btn{width:100%;margin-top:20px}
  .err{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:11px;padding:9px 12px;font-size:13px;margin-top:12px}
  /* layout */
  main{padding:24px 0}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:18px}
  .kpis{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;min-width:140px}
  .kpi .n{font-size:24px;font-weight:700}
  .kpi .l{color:var(--mut);font-size:12px}
  .devlist{display:flex;flex-direction:column;gap:8px}
  .dev{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .12s,transform .12s}
  .dev:hover{border-color:var(--cherry);transform:translateY(-1px)}
  .dev.active{border-left-color:var(--cherry);background:var(--cherry-soft)}
  .dev .nm{font-weight:600}
  .dev .mt{color:var(--mut);font-size:11.5px;margin-top:2px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.off{background:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:11px;border-bottom:1px solid var(--line)}
  td{padding:11px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr:hover td{background:var(--cherry-soft)}
  .mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;color:var(--ink2)}
  .tag{display:inline-block;background:var(--cherry-soft);color:var(--cherry);border:1px solid var(--ring);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .hidden{display:none}
  .shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .shot{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf);transition:transform .12s,border-color .12s}
  .shot:hover{transform:translateY(-2px);border-color:var(--cherry)}
  .shot img{width:100%;height:120px;object-fit:cover;cursor:pointer;display:block}
  .shot figcaption{padding:6px 8px;font-size:11px;color:var(--mut)}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const api = {
  async login(email,password){
    const r=await fetch("/api/v1/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||"login failed");
    return r.json();
  },
  async devices(){ const r=await fetch("/api/v1/admin/devices"); if(r.status===401) throw new Error("unauthorized"); return r.json(); },
  async events(q){
    const p=new URLSearchParams(); if(q.device)p.set("device",q.device); if(q.event_type)p.set("event_type",q.event_type);
    if(q.from)p.set("from",q.from); if(q.to)p.set("to",q.to);
    const r=await fetch("/api/v1/admin/events?"+p.toString()); if(r.status===401) throw new Error("unauthorized"); return r.json();
  },
  async screenshots(device){
    const p=new URLSearchParams(); if(device)p.set("device",device);
    const r=await fetch("/api/v1/admin/screenshots?"+p.toString()); if(r.status===401) throw new Error("unauthorized"); return r.json();
  },
  imageUrl(id){ return "/api/v1/admin/screenshots/"+encodeURIComponent(id)+"/image"; },
};
const IST="Asia/Kolkata";
function fmtTime(s){ if(!s) return "—"; const d=new Date(s.replace(" ","T")); if(isNaN(d)) return s;
  return d.toLocaleString("en-IN",{timeZone:IST,year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:true})+" IST"; }
function online(last){ if(!last) return false; const d=new Date(last.replace(" ","T")); return (Date.now()-d.getTime())<5*60*1000; }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

const app=document.getElementById("app");
let state={devices:[],active:null,type:"",from:"",to:""};

function loginView(msg){
  app.innerHTML="";
  const box=el(`<div class="card login">
    <h1>SNS Central</h1>
    <div class="muted">Sign in to your organization dashboard</div>
    <div class="field"><label>Email</label><input id="em" type="email" placeholder="boss@company.com"/></div>
    <div class="field"><label>Password</label><input id="pw" type="password" placeholder="••••••••"/></div>
    <button class="btn" id="go">Sign in</button>
    ${msg?`<div class="err">${msg}</div>`:""}
  </div>`);
  app.appendChild(box);
  const submit=async()=>{
    try{ await api.login(box.querySelector("#em").value,box.querySelector("#pw").value); dashboard(); }
    catch(e){ loginView(e.message||"login failed"); }
  };
  box.querySelector("#go").onclick=submit;
  box.querySelector("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
}

function header(){
  return `<header><div class="wrap">
    <div class="logo">S</div>
    <div class="brand">SNS Central<small>organization dashboard</small></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="refresh">Refresh</button>
  </div></header>`;
}

async function dashboard(){
  app.innerHTML=header()+`<main><div class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div><div class="muted" style="margin-bottom:8px">Devices</div><div class="devlist" id="devs"></div></div>
      <div class="card" id="detail"></div>
    </div>
  </div></main>`;
  app.querySelector("#refresh").onclick=loadDevices;
  await loadDevices();
}

async function loadDevices(){
  let devs;
  try{ devs=await api.devices(); }catch(e){ return loginView("Session expired — sign in again."); }
  state.devices=devs;
  const on=devs.filter(d=>online(d.last_seen_at)).length;
  app.querySelector("#kpis").innerHTML=
    `<div class="kpi"><div class="n">${devs.length}</div><div class="l">Devices</div></div>
     <div class="kpi"><div class="n">${on}</div><div class="l">Online</div></div>
     <div class="kpi"><div class="n">${devs.length-on}</div><div class="l">Offline</div></div>`;
  const list=app.querySelector("#devs"); list.innerHTML="";
  if(!devs.length){ list.innerHTML=`<div class="muted">No devices enrolled yet.</div>`; }
  devs.forEach(d=>{
    const node=el(`<div class="dev ${state.active===d.device_id?"active":""}">
      <div class="nm"><span class="dot ${online(d.last_seen_at)?"on":"off"}"></span>${d.system_name||d.device_id}</div>
      <div class="mt">${d.hostname||"—"} · ${d.os_version||"—"}</div>
      <div class="mt">last seen ${fmtTime(d.last_seen_at)}</div>
    </div>`);
    node.onclick=()=>{ state.active=d.device_id; loadDevices(); showDevice(d); };
    list.appendChild(node);
  });
  const detail=app.querySelector("#detail");
  if(state.active){ const d=devs.find(x=>x.device_id===state.active); if(d) showDevice(d); }
  else detail.innerHTML=`<div class="muted">Select a device to see its activity across apps, browser, USB transfers, prints and alerts.</div>`;
}

async function showDevice(d){
  const detail=app.querySelector("#detail");
  detail.innerHTML=`<div style="font-weight:700;font-size:16px">${d.system_name||d.device_id}</div>
    <div class="muted" style="margin:2px 0 14px">${d.hostname||"—"} · agent v${d.agent_version||"—"}</div>
    <div class="toolbar">
      <select id="ty">
        <option value="">All events</option>
        <option value="BROWSER_ACTIVITY">Browser</option>
        <option value="ACTIVE_APPLICATION_CHANGED">Applications</option>
        <option value="FILE_COPIED_TO_USB">USB file copy</option>
        <option value="DOCUMENT_PRINTED">Printed</option>
        <option value="USB_DEVICE_CONNECTED">USB connect</option>
        <option value="SESSION_IDLE">Idle</option>
      </select>
      <input id="from" type="date"/><input id="to" type="date"/>
      <button class="btn sm" id="apply">Apply</button>
      <button class="btn ghost sm" id="shots">Screenshots</button>
      <span class="muted" id="cnt"></span>
    </div>
    <div id="shotgrid" class="shotgrid hidden"></div>
    <div style="overflow:auto"><table><thead><tr><th>Time (IST)</th><th>Type</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table></div>`;
  detail.querySelector("#ty").value=state.type;
  detail.querySelector("#from").value=state.from;
  detail.querySelector("#to").value=state.to;
  const run=async()=>{
    state.type=detail.querySelector("#ty").value;
    state.from=detail.querySelector("#from").value;
    state.to=detail.querySelector("#to").value;
    const q={device:d.device_id,event_type:state.type||undefined};
    if(state.from)q.from=state.from+"T00:00:00+05:30";
    if(state.to){const [y,m,da]=state.to.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,da));dt.setUTCDate(dt.getUTCDate()+1);q.to=dt.toISOString().slice(0,10)+"T00:00:00+05:30";}
    let rows; try{ rows=await api.events(q); }catch(e){ return loginView("Session expired — sign in again."); }
    detail.querySelector("#cnt").textContent=rows.length+" event(s)";
    const tb=detail.querySelector("#rows"); tb.innerHTML="";
    if(!rows.length){ tb.innerHTML=`<tr><td colspan="3" class="muted">No events.</td></tr>`; }
    rows.forEach(r=>{
      const detailTxt=r.window_title||r.application_name||r.metadata_json||"—";
      tb.appendChild(el(`<tr><td class="mono">${fmtTime(r.timestamp_utc)}</td><td><span class="tag">${r.event_type}</span></td><td>${escapeHtml(detailTxt)}</td></tr>`));
    });
  };
  detail.querySelector("#apply").onclick=run;
  const grid=detail.querySelector("#shotgrid");
  detail.querySelector("#shots").onclick=async()=>{
    if(!grid.classList.contains("hidden")){ grid.classList.add("hidden"); return; }
    grid.classList.remove("hidden"); grid.innerHTML=`<div class="muted">Loading…</div>`;
    let shots; try{ shots=await api.screenshots(d.device_id); }catch(e){ return loginView("Session expired — sign in again."); }
    if(!shots.length){ grid.innerHTML=`<div class="muted">No screenshots synced for this device.</div>`; return; }
    grid.innerHTML="";
    shots.forEach(s=>{
      const fig=el(`<figure class="shot"><img loading="lazy" src="${api.imageUrl(s.screenshot_id)}" alt=""/><figcaption>${fmtTime(s.timestamp_utc)}</figcaption></figure>`);
      fig.querySelector("img").onclick=()=>window.open(api.imageUrl(s.screenshot_id),"_blank");
      grid.appendChild(fig);
    });
  };
  run();
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// Boot: try devices (cookie may already be valid), else login.
(async()=>{ try{ await api.devices(); dashboard(); }catch(e){ loginView(); } })();
</script>
</body>
</html>
