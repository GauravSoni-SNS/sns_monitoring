<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SNS — Create your organization</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#eceef5;--mut:#7a8099;--line:rgba(255,255,255,.09);--cherry:#8b7bff;--grad:linear-gradient(135deg,#7c6cff,#a855f7);--bg:#080910;--surf2:rgba(255,255,255,.06);--ok:#34d399;--ok-soft:rgba(52,211,153,.14);--bad:#fb7185;--bad-soft:rgba(251,113,133,.14)}
  *{box-sizing:border-box}body{margin:0;font-family:"Inter",system-ui,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:radial-gradient(1000px 600px at 50% -10%,rgba(124,108,255,.2),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(168,85,247,.12),transparent 55%),var(--bg);min-height:100vh}
  .card{max-width:440px;margin:7vh auto;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:32px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
  h1{margin:0 0 4px;font-size:23px;letter-spacing:-.02em}.sub{color:var(--mut);font-size:13px}
  label{display:block;font-size:12.5px;color:#b6bacb;margin:16px 0 5px}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--surf2);color:var(--ink)}
  input::placeholder{color:var(--mut)}
  input:focus{outline:none;border-color:var(--cherry);box-shadow:0 0 0 3px rgba(124,108,255,.38)}
  button{width:100%;margin-top:22px;background:var(--grad);color:#fff;border:0;border-radius:11px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(124,108,255,.3)}
  button:hover{transform:translateY(-1px)}
  .err{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:11px;padding:9px 12px;font-size:13px;margin-top:12px}
  .ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:11px;padding:14px;margin-top:14px}
  .tok{font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;word-break:break-all;background:rgba(0,0,0,.3);border:1px dashed var(--ok);border-radius:8px;padding:8px;margin-top:8px;color:var(--ink)}
  a{color:var(--cherry)}
</style></head>
<body><div class="card">
  <h1>Create your organization</h1>
  <div class="sub">Start a 14-day trial — 5 devices. You'll get an enroll token for your team's PCs.</div>
  <div id="form">
    <label>Business name</label><input id="org" placeholder="Acme Pvt Ltd"/>
    <label>Admin email</label><input id="em" type="email" placeholder="boss@acme.com"/>
    <label>Password (8+ chars)</label><input id="pw" type="password"/>
    <button id="go">Create organization</button>
    <div id="msg"></div>
  </div>
  <div id="done" style="display:none"></div>
</div>
<script>
document.getElementById("go").onclick=async()=>{
  const msg=document.getElementById("msg"); msg.innerHTML="";
  const body={org_name:org.value,admin_email:em.value,admin_password:pw.value};
  const r=await fetch("/api/v1/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ msg.innerHTML=`<div class="err">${j.error||"signup failed"}</div>`; return; }
  document.getElementById("form").style.display="none";
  document.getElementById("done").style.display="block";
  document.getElementById("done").innerHTML=
    `<div class="ok"><b>Organization created.</b><br/>Save this device enroll token (shown once) — you'll use it to enroll each team PC:
     <div class="tok">${j.enroll_token}</div></div>
     <p class="sub" style="margin-top:14px">On each Windows PC, install the SNS agent, then run:<br/>
     <code>sns-agentctl enroll --server &lt;this server URL&gt; --token &lt;token above&gt;</code></p>
     <p><a href="/">Go to your dashboard →</a></p>`;
};
</script>
</body></html>
